<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Gerador de dados.json | Concurso e Molotov</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6">
  <div class="max-w-6xl mx-auto">
    <header class="mb-8 border-b border-slate-800 pb-4 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-cyan-400">Painel de Importação e Geração de Dados</h1>
        <p class="text-sm text-slate-400">Converte a folha de cálculo <code>Concurso e Molotov.xlsx</code> no ficheiro <code>dados.json</code>.</p>
      </div>
      <span class="px-3 py-1 bg-cyan-950 border border-cyan-800 text-cyan-400 text-xs rounded-full font-mono">v3.0 Atualizado</span>
    </header>

    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 mb-6">
      <label class="block text-sm font-medium text-slate-300 mb-2">Carregar folha de cálculo (.xlsx):</label>
      <input type="file" id="fileInput" accept=".xlsx, .xls, .csv" class="block w-full text-sm text-slate-400 file:mr-4 file:py-2.5 file:px-5 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-cyan-500 file:text-slate-950 hover:file:bg-cyan-400 cursor-pointer mb-4" />
      
      <div id="statusMsg" class="hidden text-sm p-3 rounded-lg mb-4"></div>

      <div class="flex gap-4">
        <button id="btnDownload" disabled class="px-6 py-2.5 bg-emerald-500 hover:bg-emerald-400 disabled:opacity-40 text-slate-950 font-bold rounded-lg transition-colors flex items-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
          Descarregar dados.json
        </button>
      </div>
    </div>

    <!-- Tabela de Diagnóstico -->
    <div id="diagnosticoContainer" class="hidden">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-lg font-semibold text-slate-200">Registos Importados (<span id="totalRegistos">0</span>)</h2>
        <span class="text-xs text-slate-400">Verifique os valores de remuneração e vagas antes de exportar</span>
      </div>
      <div class="overflow-x-auto bg-slate-900 border border-slate-800 rounded-xl max-h-[500px]">
        <table class="w-full text-left text-xs text-slate-300">
          <thead class="bg-slate-800/90 text-slate-400 font-semibold uppercase sticky top-0 backdrop-blur">
            <tr>
              <th class="p-3">Ano</th>
              <th class="p-3">Concurso</th>
              <th class="p-3">Cargo</th>
              <th class="p-3">Remuneração</th>
              <th class="p-3">Vagas</th>
              <th class="p-3">CR</th>
              <th class="p-3">Inscrições</th>
              <th class="p-3">Prova</th>
              <th class="p-3">Status</th>
            </tr>
          </thead>
          <tbody id="tabelaCorpo" class="divide-y divide-slate-800 font-mono"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let concursosProcessados = [];

    function normalizarTexto(txt) {
      if (!txt) return '';
      return String(txt)
        .replace(/[\r\n]+/g, ' ')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .replace(/[^a-z0-9]/g, '');
    }

    function formatarData(dataVal) {
      if (!dataVal) return 'A definir';
      if (dataVal instanceof Date) {
        return dataVal.toLocaleDateString('pt-BR');
      }
      let str = String(dataVal).trim();
      if (/^\d{4}-\d{2}-\d{2}/.test(str)) {
        const [ano, mes, dia] = str.slice(0, 10).split('-');
        return `${dia}/${mes}/${ano}`;
      }
      return str;
    }

    function extrairRemuneracao(val) {
      if (val === undefined || val === null || val === '') return null;
      if (typeof val === 'number') return isNaN(val) ? null : val;
      
      let str = String(val).replace(/[\r\n]+/g, ' ').replace(/[R$\s]/g, '');
      const match = str.match(/\d{1,3}(?:\.\d{3})*,\d{2}|\d+(?:\.\d+)?/);
      if (match) {
        let numStr = match[0];
        if (numStr.includes(',')) {
          numStr = numStr.replace(/\./g, '').replace(',', '.');
        }
        const parsed = parseFloat(numStr);
        return isNaN(parsed) ? null : parsed;
      }
      return null;
    }

    function extrairVagas(val) {
      if (val === undefined || val === null || val === '') return '0';
      let str = String(val).trim();
      if (/cr/i.test(str)) return 'CR';
      let parsed = parseInt(str, 10);
      return isNaN(parsed) ? str : String(parsed);
    }

    document.getElementById('fileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, { type: 'array', cellDates: true });
        
        // Seleciona o separador correto
        const sheetName = workbook.SheetNames.includes('Concursos de TI') ? 'Concursos de TI' : workbook.SheetNames[0];
        const sheet = workbook.Sheets[sheetName];
        const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });

        concursosProcessados = rows.map((row, idx) => {
          let chaves = {};
          Object.keys(row).forEach(k => {
            chaves[normalizarTexto(k)] = row[k];
          });

          const getVal = (termos) => {
            for (let t of termos) {
              const chave = Object.keys(chaves).find(k => k.includes(t));
              if (chave && chaves[chave] !== '') return chaves[chave];
            }
            return '';
          };

          const concurso = String(getVal(['concurso', 'orgao'])).trim();
          if (!concurso) return null;

          const cargo = String(getVal(['cargo', 'especialidade'])).trim();
          const remun = extrairRemuneracao(getVal(['remuneracaoinicial', 'remuneracao', 'salario', 'vencimento']));
          const vagas = extrairVagas(getVal(['vagasimediatas', 'vagasimediata', 'vagas']));
          const cr = String(getVal(['cadastror', 'cr'])).trim() || 'Não informado';
          const banca = String(getVal(['banca'])).trim() || 'A definir';
          const status = String(getVal(['status'])).trim() || 'Previsto';
          const local = String(getVal(['local'])).trim() || 'Distrito Federal/Nacional';
          const inscDe = formatarData(getVal(['iniciodasinscricoes', 'inscricoesde', 'inicio']));
          const inscAte = formatarData(getVal(['terminodasinscricoes', 'inscricoesate', 'fim']));
          const dataProva = formatarData(getVal(['datadaprova', 'dataprova', 'prova']));
          const edital = String(getVal(['edital', 'link'])).trim();
          const ano = getVal(['ano']) || 2026;

          return {
            id: idx + 1,
            ano: ano,
            status: status,
            concurso: concurso,
            banca: banca,
            inscricoesDe: inscDe,
            inscricoesAte: inscAte,
            cargo: cargo || 'Especialidades de TI a definir',
            vagasImediatas: vagas,
            cadastroReserva: cr,
            localProva: local,
            dataProva: dataProva,
            remuneracaoInicial: remun,
            editalUrl: edital && edital.startsWith('http') ? edital : null
          };
        }).filter(Boolean);

        // Renderização do diagnóstico
        const tabela = document.getElementById('tabelaCorpo');
        tabela.innerHTML = '';
        concursosProcessados.forEach(c => {
          const tr = document.createElement('tr');
          const remunTxt = c.remuneracaoInicial 
            ? `R$ ${c.remuneracaoInicial.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`
            : '<span class="text-amber-400">Consulte Edital</span>';

          tr.innerHTML = `
            <td class="p-3 text-slate-400">${c.ano}</td>
            <td class="p-3 font-bold text-slate-100">${c.concurso}</td>
            <td class="p-3 text-cyan-300 max-w-xs truncate" title="${c.cargo}">${c.cargo}</td>
            <td class="p-3 text-emerald-400 font-semibold">${remunTxt}</td>
            <td class="p-3">${c.vagasImediatas}</td>
            <td class="p-3 text-slate-400">${c.cadastroReserva}</td>
            <td class="p-3 text-slate-300">${c.inscricoesAte !== 'A definir' ? c.inscricoesAte : '-'}</td>
            <td class="p-3 text-slate-300">${c.dataProva}</td>
            <td class="p-3"><span class="px-2 py-0.5 rounded text-[10px] bg-slate-800 text-slate-300 border border-slate-700">${c.status}</span></td>
          `;
          tabela.appendChild(tr);
        });

        document.getElementById('totalRegistos').textContent = concursosProcessados.length;
        document.getElementById('diagnosticoContainer').classList.remove('hidden');
        document.getElementById('btnDownload').disabled = false;

        const statusMsg = document.getElementById('statusMsg');
        statusMsg.className = 'text-sm p-3 rounded-lg mb-4 bg-emerald-950 text-emerald-300 border border-emerald-800';
        statusMsg.textContent = `Sucesso: ${concursosProcessados.length} registos carregados com sucesso a partir da folha 'Concursos de TI'!`;
        statusMsg.classList.remove('hidden');
      };
      reader.readAsArrayBuffer(file);
    });

    document.getElementById('btnDownload').addEventListener('click', function() {
      const blob = new Blob([JSON.stringify(concursosProcessados, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'dados.json';
      a.click();
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
